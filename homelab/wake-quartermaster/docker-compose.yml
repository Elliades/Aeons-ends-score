services:
  web:
    build: .
    image: wake-quartermaster:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "3087"
      WOL_MAC: "18:C0:4D:A9:10:3A"
      WOL_BROADCAST: "192.168.1.255"
      WOL_UNICAST: "192.168.1.158"
      WOL_HOST_NAME: "Quatermaster"
      WOL_PACKET_COUNT: "5"
      WINDOWS_WOL_URL: "http://172.22.48.1:3088/wake"
      WAKE_TOKEN: "${WAKE_TOKEN:-}"
