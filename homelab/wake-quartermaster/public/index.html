<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réveiller Quatermaster</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      padding: 1rem;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
    button {
      width: 100%;
      border: none;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #token {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      display: none;
    }
    #status {
      margin-top: 1rem;
      min-height: 1.25rem;
      font-size: 0.95rem;
    }
    .ok { color: var(--success); }
    .err { color: var(--error); }
  </style>
</head>
<body>
  <main class="card">
    <h1>⚡ Quatermaster</h1>
    <p>Envoie un paquet Wake-on-LAN pour démarrer le PC depuis le réseau local.</p>
    <input id="token" type="password" placeholder="Token (si requis)" autocomplete="off" />
    <button id="wake" type="button">Réveiller le PC</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const wakeBtn = document.getElementById('wake');
    const statusEl = document.getElementById('status');
    const tokenEl = document.getElementById('token');

    async function init() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.host) {
          document.querySelector('h1').textContent = '⚡ ' + data.host;
        }
      } catch (_) {}
    }

    wakeBtn.addEventListener('click', async () => {
      wakeBtn.disabled = true;
      statusEl.textContent = 'Envoi du magic packet…';
      statusEl.className = '';

      const headers = { 'Content-Type': 'application/json' };
      const body = {};
      if (tokenEl.value) {
        headers['X-Wake-Token'] = tokenEl.value;
        body.token = tokenEl.value;
      }

      try {
        const res = await fetch('/api/wake', { method: 'POST', headers, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Échec');
        statusEl.textContent = data.message || 'Paquet envoyé !';
        statusEl.className = 'ok';
      } catch (err) {
        statusEl.textContent = err.message || 'Erreur réseau';
        statusEl.className = 'err';
      } finally {
        wakeBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
